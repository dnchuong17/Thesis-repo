<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Primary gradient using VietFlood brand colors -->
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient for decorative elements -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>

    <!-- Shadow filter for depth -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background gradient -->
  <rect width="400" height="300" fill="url(#heroGradient)" />

  <!-- Decorative top-left circle -->
  <circle cx="80" cy="40" r="60" fill="rgba(255, 255, 255, 0.08)" />

  <!-- Decorative bottom-right circle -->
  <circle cx="340" cy="260" r="80" fill="rgba(255, 255, 255, 0.06)" />

  <!-- Main illustration: Relief/Help concept -->
  <!-- Building/House structure (represents shelter/relief) -->
  <g filter="url(#shadow)">
    <!-- Building base -->
    <rect x="80" y="120" width="100" height="120" fill="rgba(255, 255, 255, 0.95)" rx="8" />
    
    <!-- Building roof (triangle) -->
    <polygon points="80,120 130,70 180,120" fill="url(#accentGradient)" />
    
    <!-- Door -->
    <rect x="115" y="160" width="30" height="60" fill="#2563EB" rx="4" />
    <circle cx="142" cy="190" r="3" fill="rgba(255, 255, 255, 0.8)" />
    
    <!-- Windows -->
    <rect x="90" y="130" width="16" height="16" fill="#60A5FA" rx="2" />
    <rect x="115" y="130" width="16" height="16" fill="#60A5FA" rx="2" />
    <rect x="140" y="130" width="16" height="16" fill="#60A5FA" rx="2" />
    <rect x="165" y="130" width="16" height="16" fill="#60A5FA" rx="2" />
  </g>

  <!-- Hand offering help (symbol of relief/care) -->
  <g filter="url(#shadow)">
    <!-- Arm -->
    <path d="M 220 180 Q 250 160 270 150" stroke="rgba(255, 255, 255, 0.95)" stroke-width="12" fill="none" stroke-linecap="round" />
    
    <!-- Hand -->
    <circle cx="275" cy="145" r="18" fill="rgba(255, 255, 255, 0.95)" />
    
    <!-- Fingers -->
    <line x1="260" y1="135" x2="255" y2="120" stroke="rgba(255, 255, 255, 0.95)" stroke-width="6" stroke-linecap="round" />
    <line x1="270" y1="128" x2="270" y2="110" stroke="rgba(255, 255, 255, 0.95)" stroke-width="6" stroke-linecap="round" />
    <line x1="280" y1="130" x2="290" y2="115" stroke="rgba(255, 255, 255, 0.95)" stroke-width="6" stroke-linecap="round" />
    <line x1="290" y1="138" x2="305" y2="130" stroke="rgba(255, 255, 255, 0.95)" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Floating elements (representing hope/relief distribution) -->
  <!-- Circle 1 (top-right) -->
  <circle cx="320" cy="100" r="12" fill="url(#accentGradient)" opacity="0.8" filter="url(#shadow)" />
  <circle cx="320" cy="100" r="6" fill="rgba(255, 255, 255, 0.3)" />

  <!-- Circle 2 (middle-right) -->
  <circle cx="340" cy="150" r="10" fill="url(#accentGradient)" opacity="0.7" filter="url(#shadow)" />
  <circle cx="340" cy="150" r="5" fill="rgba(255, 255, 255, 0.3)" />

  <!-- Circle 3 (bottom-right) -->
  <circle cx="350" cy="210" r="8" fill="url(#accentGradient)" opacity="0.6" filter="url(#shadow)" />
  <circle cx="350" cy="210" r="4" fill="rgba(255, 255, 255, 0.3)" />

  <!-- Decorative line elements (representing connection/network) -->
  <line x1="300" y1="85" x2="320" y2="100" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="320" y1="110" x2="335" y2="150" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-dasharray="4,4" />
  <line x1="340" y1="160" x2="345" y2="210" stroke="rgba(255, 255, 255, 0.2)" stroke-width="2" stroke-dasharray="4,4" />
</svg>
